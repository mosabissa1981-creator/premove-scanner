name: Scorch Hot Cloudflare

on:
  pull_request:
    paths:
      - "scorch-hot/**"
      - "scripts/build.mjs"
      - "wrangler.toml"
  push:
    branches:
      - main
    paths:
      - "scorch-hot/**"
      - "scripts/build.mjs"
      - "wrangler.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scorch-hot/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Build scorch-hot for Cloudflare
        run: WORKERS_CI=1 npm run build
      - name: Validate wrangler bundle
        run: npx wrangler deploy --dry-run
      - name: Validate preview upload bundle
        run: npx wrangler versions upload --dry-run
