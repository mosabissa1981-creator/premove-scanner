<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>PreMove — Add API Key</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b;
      color: #fafafa;
      padding: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a1a1aa; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 14px; margin: 20px 0 8px; color: #d4d4d8; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fff;
      font-family: ui-monospace, monospace;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; }
    #count { font-size: 12px; color: #71717a; margin-top: 8px; }
    #msg { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    #msg.ok { display: block; background: #10b98120; color: #6ee7b7; border: 1px solid #10b98150; }
    #msg.err { display: block; background: #ef444420; color: #fca5a5; border: 1px solid #ef444450; }
    a { color: #34d399; }
  </style>
</head>
<body>
  <h1>Add API Key</h1>
  <p>Paste your Unusual Whales API token below. This simple page works on all phones.</p>

  <form id="form">
    <label for="key">Unusual Whales API Key</label>
    <input
      id="key"
      name="key"
      type="text"
      placeholder="Paste UUID token here"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    />
    <div id="count">0 characters — paste your key above</div>
    <button type="submit" id="btn">Save Key</button>
  </form>

  <div id="msg"></div>

  <p style="margin-top:24px;text-align:center;font-size:13px">
    <a href="/">← Back to Scanner</a>
  </p>

  <script>
    const keyInput = document.getElementById('key');
    const countEl = document.getElementById('count');
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('btn');
    const form = document.getElementById('form');

    function normalizeKey(raw) {
      return raw.trim().replace(/^Bearer\s+/i, '');
    }

    function updateCount() {
      const len = normalizeKey(keyInput.value).length;
      countEl.textContent = len > 0
        ? len + ' characters detected — tap Save Key'
        : '0 characters — paste your key above';
    }

    keyInput.addEventListener('input', updateCount);
    keyInput.addEventListener('paste', function() { setTimeout(updateCount, 50); });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      msgEl.className = '';
      msgEl.style.display = 'none';

      const key = normalizeKey(keyInput.value);
      if (!key) {
        msgEl.textContent = 'Paste your API key first.';
        msgEl.className = 'err';
        return;
      }
      if (key.length < 20) {
        msgEl.textContent = 'Key too short (' + key.length + ' chars). Copy the full token.';
        msgEl.className = 'err';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/settings/save', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: key }),
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          try { localStorage.setItem('premove_uw_api_key', key); } catch (_) {}
          msgEl.innerHTML = '✓ Saved! <a href="/" style="color:#6ee7b7;font-weight:bold">Go to Scanner →</a>';
          msgEl.className = 'ok';
          setTimeout(function() { window.location.href = '/'; }, 1500);
        } else {
          msgEl.textContent = data.error || 'Save failed. Try again.';
          msgEl.className = 'err';
          btn.disabled = false;
          btn.textContent = 'Save Key';
        }
      } catch (err) {
        msgEl.textContent = 'Network error. Check connection and retry.';
        msgEl.className = 'err';
        btn.disabled = false;
        btn.textContent = 'Save Key';
      }
    });
  </script>
</body>
</html>
